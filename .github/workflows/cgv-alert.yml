name: CGV Opening Alert

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-cgv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CGV checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python open_alert.py

      - name: Save alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open_alert_state.json
          git diff --cached --quiet || git commit -m "Update alert state"
          git push
