name: CGV seat alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cgv-seat-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare config
        run: |
          if [ ! -f config.json ]; then
            cp config.example.json config.json
          fi

      - name: Diagnose CGV API
        run: |
          echo "=== DAISO HEALTH ==="
          npx --yes daiso health || true

          echo "=== CGV MOVIES ==="
          npx --yes daiso get /api/cgv/movies --keyword "용산아이파크몰" --theaterCode "0013" --playDate "20261111" --json || true

          echo "=== CGV TIMETABLE ==="
          npx --yes daiso get /api/cgv/timetable --keyword "용산아이파크몰" --theaterCode "0013" --playDate "20261111" --json || true
          
      - name: Restore previous seat states
        uses: actions/cache/restore@v4
        with:
          path: state-*.json
          key: cgv-state-${{ github.run_id }}
          restore-keys: |
            cgv-state-

      - name: Check four screenings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          THEATER_CODE: "0013"
          THEATER_KEYWORD: "용산아이파크몰"
          THEATER_NAME: "CGV 용산아이파크몰 IMAX"
          MOVIE_NAME: "듄"
          ALERT_SOURCE: "CGV 취소표"
        run: |
          check_event() {
            date="$1"
            time="$2"
            safe_time="${time/:/}"
            state_file="state-${date}-${safe_time}.json"

            if [ -f "$state_file" ]; then
              cp "$state_file" state.json
            else
              rm -f state.json
            fi

            export PLAY_DATE="$date"
            export START_TIME="$time"
            export ALERT_SOURCE="CGV 취소표 ${date} ${time}"

            echo "Checking ${date} ${time}"
            python monitor.py --once || echo "Check failed: ${date} ${time}"

            if [ -f state.json ]; then
              cp state.json "$state_file"
            fi
          }

          check_event "20261111" "08:00"
          check_event "20261112" "15:00"
          check_event "20261112" "18:15"
          check_event "20261112" "21:30"

      - name: Save previous seat states
        if: always() && hashFiles('state-*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state-*.json
          key: cgv-state-${{ github.run_id }}
