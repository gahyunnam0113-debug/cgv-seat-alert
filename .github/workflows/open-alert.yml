name: CGV booking open alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose Daiso service
        continue-on-error: true
        run: |
          echo "=== DAISO HEALTH CHECK ==="
          npx --yes daiso health
          
      - name: Check CGV booking
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python open_alert.py

